<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Darkness</title>
<meta name="description" content="Manage your Darkness account and view your purchases.">
<link rel="icon" type="image/png" href="assets/img/favicon-circle.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/tokens.css?v=1">
<link rel="stylesheet" href="assets/css/home.css?v=1">
<link rel="stylesheet" href="assets/css/marketplace.css?v=1">

<style>
.acct-wrap{
  max-width:760px;
  margin:0 auto;
  padding:clamp(3rem, 7vw, 5rem) var(--gutter) 4rem;
}
.acct-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  margin-bottom:2.4rem;
  flex-wrap:wrap;
}
.acct-eyebrow{
  font-size:.78rem;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--text-faint);
  margin-bottom:.5rem;
}
.acct-title{
  font-family:var(--font-display);
  font-size:clamp(1.8rem, 3.6vw, 2.4rem);
  font-weight:600;
  letter-spacing:-.02em;
}
.acct-logout{
  padding:.6rem 1.3rem;
  border-radius:980px;
  border:1px solid var(--border);
  background:none;
  color:var(--text);
  font-size:.85rem;
  font-weight:600;
  cursor:pointer;
}
.acct-logout:hover{ background:var(--surface-2); }
.acct-section{
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:1.6rem;
  margin-bottom:1.2rem;
}
.acct-section h3{
  font-size:.95rem;
  font-weight:600;
  margin-bottom:.3rem;
}
.acct-section p{
  color:var(--text-faint);
  font-size:.9rem;
}
</style>
</head>
<body>

<div class="cursor-glow" aria-hidden="true"></div>

<header class="nav">
  <a href="index.html" class="nav__mark" aria-label="Darkness home">
    <img src="assets/img/logo.png" alt="" class="nav__mark-glyph" aria-hidden="true">
    Darkness
  </a>
  <nav class="nav__links" aria-label="Primary">
    <a href="index.html#about">Studio</a>
    <a href="index.html#pipeline">Process</a>
    <a href="marketplace.html">Marketplace</a>
    <a href="index.html#ventures">Ventures</a>
  </nav>
  <div style="display:flex; align-items:center;">
    <span data-dc-account style="margin-left:1rem;"></span>
  </div>
</header>

<main>
  <div class="acct-wrap" id="acctContent">
    <p class="admin-empty">Loading…</p>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom">
      <span>© 2026 Darkness. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js?v=3"></script>
<script src="assets/js/auth.js?v=3"></script>
<script>
(function () {
  const content = document.getElementById('acctContent');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (m) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
    ));
  }

  async function load() {
    const user = await DCAuth.getUser();
    if (!user) {
      window.location.href = 'login.html';
      return;
    }

    // Fetch the current username (may be null if they haven't set one yet).
    const profile = await DCAuth.getProfile();
    const currentUsername = (profile && profile.username) ? profile.username : '';

    // Show username as the heading if set, otherwise fall back to email.
    const heading = currentUsername || user.email;

    content.innerHTML = `
      <div class="acct-header">
        <div>
          <div class="acct-eyebrow">Account</div>
          <h1 class="acct-title">${esc(heading)}</h1>
        </div>
        <button class="acct-logout" id="logoutBtn">Log out</button>
      </div>

      <div class="acct-section">
        <h3>Username</h3>
        <p style="margin-bottom:.9rem;">This is how you'll show up around Darkness. 3–20 characters, letters, numbers and underscores. Must be unique.</p>
        <div style="display:flex; gap:.6rem; flex-wrap:wrap; align-items:center;">
          <input type="text" id="usernameInput" placeholder="Choose a username"
            value="${esc(currentUsername)}"
            autocomplete="off" spellcheck="false"
            style="flex:1; min-width:220px; padding:.7rem 1rem; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:.95rem; font-family:inherit;">
          <button class="acct-logout" id="saveUsernameBtn"
            style="border:none; background:var(--text); color:#0a0a0a;">Save</button>
        </div>
        <p id="usernameMsg" style="min-height:1.2em; margin-top:.6rem; font-size:.85rem; color:var(--text-faint);"></p>
      </div>

      <div class="acct-section">
        <h3>My purchases</h3>
        <p>Nothing here yet — once checkout is live, everything you buy will show up in this list with instant downloads.</p>
      </div>
    `;

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await DCAuth.signOut();
      window.location.href = 'index.html';
    });

    /* ---- Username save logic ---- */
    const input   = document.getElementById('usernameInput');
    const saveBtn = document.getElementById('saveUsernameBtn');
    const msg     = document.getElementById('usernameMsg');
    const title   = document.querySelector('.acct-title');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.style.color = type === 'error'   ? '#f87171'
                      : type === 'success' ? '#34d399'
                      : 'var(--text-faint)';
    }

    saveBtn.addEventListener('click', async () => {
      const val = input.value.trim();

      if (!val) { showMsg('Enter a username first.', 'error'); return; }
      if (!/^[a-zA-Z0-9_]{3,20}$/.test(val)) {
        showMsg('3–20 characters — letters, numbers and underscores only.', 'error');
        return;
      }

      saveBtn.disabled = true;
      showMsg('Saving…');

      const result = await DCAuth.updateUsername(val);
      saveBtn.disabled = false;

      if (result.error) {
        const taken = result.error.code === '23505'
          || /duplicate|unique/i.test(result.error.message || '');
        showMsg(taken ? 'That username is taken — try another.'
                      : (result.error.message || 'Could not save. Try again.'), 'error');
        return;
      }

      showMsg('Saved!', 'success');
      if (title) title.textContent = val; // update heading live
    });

    // Let Enter key save too.
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); saveBtn.click(); }
    });
  }

  load();
})();
</script>

</body>
</html>
