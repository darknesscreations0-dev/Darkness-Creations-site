<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Darkness</title>
<meta name="description" content="Log in or create an account on Darkness.">
<link rel="icon" type="image/png" href="assets/img/favicon-circle.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/tokens.css?v=1">
<link rel="stylesheet" href="assets/css/home.css?v=1">
<link rel="stylesheet" href="assets/css/marketplace.css?v=1">

<style>
.auth-wrap{
  max-width:420px;
  margin:0 auto;
  padding:clamp(3.5rem, 8vw, 6rem) var(--gutter) 4rem;
}
.auth-eyebrow{
  font-size:.78rem;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--text-faint);
  text-align:center;
  margin-bottom:.6rem;
}
.auth-title{
  font-family:var(--font-display);
  font-size:clamp(2rem, 4vw, 2.6rem);
  font-weight:600;
  letter-spacing:-.02em;
  text-align:center;
  margin-bottom:2rem;
}
.auth-tabs{
  display:flex;
  border:1px solid var(--border);
  border-radius:980px;
  padding:4px;
  margin-bottom:1.8rem;
}
.auth-tab{
  flex:1;
  text-align:center;
  padding:.6rem 1rem;
  border-radius:980px;
  border:none;
  background:none;
  color:var(--text-faint);
  font-size:.9rem;
  font-weight:600;
  cursor:pointer;
  transition:background .25s var(--ease), color .25s var(--ease);
}
.auth-tab.is-active{ background:var(--text); color:#0a0a0a; }
.auth-field{ margin-bottom:1rem; }
.auth-field label{
  display:block;
  font-size:.8rem;
  color:var(--text-faint);
  margin-bottom:.4rem;
}
.auth-field input{
  width:100%;
  padding:.8rem 1rem;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  font-size:.95rem;
  font-family:inherit;
}
.auth-field input:focus{ outline:2px solid var(--text); outline-offset:1px; }
.auth-submit{
  width:100%;
  padding:.9rem 1rem;
  border-radius:980px;
  border:none;
  background:var(--text);
  color:#0a0a0a;
  font-size:.95rem;
  font-weight:600;
  cursor:pointer;
  margin-top:.4rem;
  transition:opacity .25s var(--ease), transform .25s var(--ease);
}
.auth-submit:hover{ opacity:.85; transform:scale(1.01); }
.auth-submit:disabled{ opacity:.5; cursor:default; transform:none; }
.auth-divider{
  display:flex;
  align-items:center;
  gap:.8rem;
  margin:1.6rem 0;
  color:var(--text-faint);
  font-size:.8rem;
}
.auth-divider::before, .auth-divider::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--border);
}
.auth-google{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.6rem;
  padding:.85rem 1rem;
  border-radius:980px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:.9rem;
  font-weight:600;
  cursor:pointer;
  transition:background .25s var(--ease);
}
.auth-google:hover{ background:var(--surface-2); }
.auth-google svg{ width:18px; height:18px; }
.auth-msg{
  min-height:1.3em;
  font-size:.85rem;
  text-align:center;
  margin-top:1rem;
  color:var(--text-faint);
}
.auth-msg.is-error{ color:#f87171; }
.auth-msg.is-success{ color:#34d399; }
</style>
</head>
<body>

<div class="cursor-glow" aria-hidden="true"></div>

<header class="nav">
  <div class="nav__inner">
    <a href="index.html" class="nav__mark" aria-label="Darkness home">
      <img src="assets/img/logo.png" alt="" class="nav__mark-glyph" aria-hidden="true">
      Darkness
    </a>
    <nav class="nav__links" aria-label="Primary">
      <a href="index.html#about">Studio</a>
      <a href="index.html#pipeline">Process</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="index.html#ventures">Ventures</a>
    </nav>
    <div class="nav__right">
      <span data-dc-account></span>
    </div>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <span class="auth-eyebrow">Darkness</span>
    <h1 class="auth-title" id="authTitle">Welcome back</h1>

    <div class="auth-tabs">
      <button class="auth-tab is-active" data-mode="login">Log in</button>
      <button class="auth-tab" data-mode="signup">Sign up</button>
    </div>

    <button class="auth-google" id="googleBtn" type="button">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.26 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.05H2.18a11 11 0 0 0 0 9.9l3.66-2.85z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.99 14.97 1 12 1a11 11 0 0 0-9.82 6.05l3.66 2.85C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider">or use email</div>

    <form id="authForm">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Log in</button>
    </form>

    <p class="auth-msg" id="authMsg"></p>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom">
      <span>© 2026 Darkness. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js?v=4"></script>
<script src="assets/js/auth.js?v=4"></script>
<script>
(function () {
  const tabs      = document.querySelectorAll('.auth-tab');
  const title     = document.getElementById('authTitle');
  const form      = document.getElementById('authForm');
  const submitBtn = document.getElementById('submitBtn');
  const msg       = document.getElementById('authMsg');
  const googleBtn = document.getElementById('googleBtn');
  const passwordInput = document.getElementById('password');
  let mode = 'login';

  function setMode(next) {
    mode = next;
    tabs.forEach((t) => t.classList.toggle('is-active', t.dataset.mode === mode));
    title.textContent = mode === 'login' ? 'Welcome back' : 'Create your account';
    submitBtn.textContent = mode === 'login' ? 'Log in' : 'Sign up';
    passwordInput.setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
    msg.textContent = '';
    msg.className = 'auth-msg';
  }

  tabs.forEach((t) => t.addEventListener('click', () => setMode(t.dataset.mode)));

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'auth-msg' + (type ? ' is-' + type : '');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) return;

    submitBtn.disabled = true;
    showMsg('One moment…');

    const result = mode === 'login'
      ? await DCAuth.signIn(email, password)
      : await DCAuth.signUp(email, password);

    submitBtn.disabled = false;

    if (result.error) {
      showMsg(result.error.message, 'error');
      return;
    }

    if (mode === 'signup' && result.data && result.data.user && !result.data.session) {
      showMsg('Check your email to confirm your account.', 'success');
      return;
    }

    window.location.href = 'account.html';
  });

  googleBtn.addEventListener('click', async () => {
    const result = await DCAuth.signInWithGoogle();
    if (result.error) showMsg(result.error.message, 'error');
  });
})();
</script>

</body>
</html>
