<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Darkness</title>
<meta name="description" content="Product details.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/tokens.css?v=1">
<link rel="stylesheet" href="assets/css/home.css?v=1">
<link rel="stylesheet" href="assets/css/marketplace.css?v=1">
<style>
  .pdp{ max-width: 1000px; margin: 0 auto; padding: 3rem var(--gutter) var(--section-pad); }
  .pdp__back{ display:inline-block; margin-bottom:1.5rem; color:var(--text-faint); text-decoration:none; }
  .pdp__back:hover{ color:var(--text); }
  .pdp__layout{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap:2.5rem; align-items:start; }
  @media (max-width: 820px){ .pdp__layout{ grid-template-columns: 1fr; } }
  .pdp__cover{ border-radius: var(--radius-md, 12px); overflow:hidden; background:var(--surface-2); aspect-ratio:16/10; }
  .pdp__cover img, .pdp__cover video{ width:100%; height:100%; object-fit:cover; display:block; }
  .pdp__gallery{ display:flex; flex-direction:column; gap:.75rem; margin-top:.75rem; }
  .pdp__gallery img, .pdp__gallery video{ width:100%; border-radius:8px; }
  .pdp__title{ margin:.4rem 0 .6rem; }
  .pdp__desc{ color:var(--text-faint); line-height:1.6; margin-bottom:1.2rem; white-space:pre-wrap; }
  .pdp__tags{ display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1.2rem; }
  .pdp__price-row{ margin-bottom:1.2rem; font-size:1.4rem; }
  .pdp__msg{ margin-top:.8rem; font-size:.9rem; }
</style>
</head>
<body>

<div class="cursor-glow" aria-hidden="true"></div>

<!-- ============ NAV ============ -->
<header class="nav">
  <a href="index.html" class="nav__mark" aria-label="Darkness home">
    <img src="assets/img/logo.png" alt="" class="nav__mark-glyph" aria-hidden="true">
    Darkness
  </a>
  <nav class="nav__links" aria-label="Primary">
    <a href="index.html#about">Studio</a>
    <a href="index.html#pipeline">Process</a>
    <a href="marketplace.html" style="color:var(--text);">Marketplace</a>
    <a href="index.html#ventures">Ventures</a>
  </nav>
  <div style="display:flex; align-items:center;">
    <a href="index.html#newsletter" class="nav__cta">Start a project</a>
  </div>
</header>

<main>
  <div class="pdp">
    <a href="marketplace.html" class="pdp__back">&larr; Back to marketplace</a>
    <div id="pdpContent">
      <p class="admin-empty">Loading…</p>
    </div>
  </div>
</main>

<!-- ============ FOOTER ============ -->
<footer class="footer">
  <div class="container">
    <div class="footer__grid">
      <div class="footer__brand">
        <a href="index.html" class="nav__mark">
          <img src="assets/img/logo.png" alt="" class="nav__mark-glyph" aria-hidden="true">
          Darkness
        </a>
        <p>A content studio and venture group — directing, producing and distributing content for brands, and selling the assets we build it with.</p>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
(function () {
  const content = document.getElementById('pdpContent');

  function priceHtml(product) {
    if (product.sale_price != null && product.sale_price !== '') {
      return `<span style="text-decoration:line-through;opacity:.5;font-size:.75em;">$${product.price}</span> <span>$${product.sale_price}</span>`;
    }
    if (!product.price || product.price == 0) return `<span class="product-card__price is-free">Free</span>`;
    return `<span>$${product.price}</span>`;
  }

  function mediaBlock(url, isVideo) {
    return isVideo
      ? `<video src="${url}" ${url ? 'controls' : ''} playsinline></video>`
      : `<img src="${url}" alt="">`;
  }

  async function load() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) {
      content.innerHTML = '<p class="admin-empty">No product specified.</p>';
      return;
    }
    if (!window.supabaseClient) {
      content.innerHTML = '<p class="admin-empty">Store is not configured yet.</p>';
      return;
    }

    const { data, error } = await window.supabaseClient
      .from('products')
      .select('*')
      .eq('id', id)
      .eq('is_active', true)
      .single();

    if (error || !data) {
      content.innerHTML = '<p class="admin-empty">Product not found or no longer available.</p>';
      return;
    }

    document.title = data.title + ' — Darkness';

    const coverIsVideo = data.cover_type === 'video';
    const galleryHtml = (data.preview_media || []).map((m) => {
      const url = m.url || '';
      const isVideo = /\.(mp4|webm|mov)(\?|$)/i.test(url);
      return mediaBlock(url, isVideo);
    }).join('');

    const tagsHtml = (data.tags || []).map((t) => `<span class="product-card__tag">${t}</span>`).join('');

    content.innerHTML = `
      <div class="pdp__layout">
        <div>
          <div class="pdp__cover">${mediaBlock(data.cover_image_url || '', coverIsVideo)}</div>
          <div class="pdp__gallery">${galleryHtml}</div>
        </div>
        <div>
          <span class="product-card__cat">${data.category || ''}</span>
          <h1 class="pdp__title">${data.title}</h1>
          <div class="pdp__tags">${tagsHtml}</div>
          <p class="pdp__desc">${data.description || ''}</p>
          <div class="pdp__price-row">${priceHtml(data)}</div>
          <button class="btn btn--buy" style="width:100%;" id="pdpBuyBtn"><span>Buy now</span></button>
          <p class="pdp__msg admin-msg" id="pdpMsg"></p>
        </div>
      </div>
    `;

    document.getElementById('pdpBuyBtn').addEventListener('click', () => {
      document.getElementById('pdpMsg').textContent = "Checkout isn't set up yet — coming soon.";
    });

    const coverVideo = content.querySelector('.pdp__cover video');
    if (coverVideo) { coverVideo.muted = true; coverVideo.autoplay = true; coverVideo.loop = true; }
  }

  load();
})();
</script>

</body>
</html>
